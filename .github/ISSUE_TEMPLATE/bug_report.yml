name: Bug report
description: Something in Kage doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, use **Security → Report a vulnerability** instead of an issue.
        Please remove hostnames, tokens and anything private from logs before you paste them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a task in …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: kage-version
    attributes:
      label: Kage version
      placeholder: "0.1.0 or a commit hash"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node --version`, `tmux -V`, `git --version`, `claude --version`, and your OS and browser.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Server output (`journalctl --user -u kage` or the terminal) and browser console errors.
      render: text
